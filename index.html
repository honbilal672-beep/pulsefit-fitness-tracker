    <meta property="og:description" content="Track workouts, log daily meals and macros, monitor body progress, and stay consistent with PulseFit." />

    <!-- Browser extension & fetch interceptor compatibility shim -->
    <script>
      (function() {
        // Prevent extension errors from bubbling to app uncaught error listeners
        window.addEventListener('error', function(e) {
          if (e && e.filename && (e.filename.indexOf('chrome-extension:') !== -1 || e.filename.indexOf('moz-extension:') !== -1)) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
        }, true);

        // Ensure window.fetch has both getter and setter for third-party extensions
        try {
          var realFetch = window.fetch;
          var fetchHolder = realFetch;

          // Attempt define on Window.prototype first, then window instance
          [Window.prototype, window].forEach(function(target) {
            try {
              var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
              if (!desc || desc.configurable) {
                Object.defineProperty(target, 'fetch', {
                  get: function() {
                    return fetchHolder;
                  },
                  set: function(newFetch) {
                    fetchHolder = newFetch;
                  },
                  configurable: true,
                  enumerable: true
                });
              }
            } catch (_) {}
          });
        } catch (_) {}
      })();
    </script>
  </head>

  </body>
